# Copenhagen household waste classes + source-dataset label mapping.
# Issue #7. STATUS: DRAFT - needs team review (see "decisions" below).
# Dataset: TACO (Trash Annotations in Context). Mapping revised 2026-11-17.

meta:
  status: draft
  sources:
    - url: https://affald.kk.dk/affaldsordninger
      note: Official list of collection schemes (Bleaffald, Madaffald, Plast, Mad- og drikkekartoner, Papir, Restaffald, Metal, Pap, Glas, Stort indbo, Batterier, Tekstilaffald)
    - url: https://affald.kk.dk/affaldsfraktion/saadan-sorterer-du-plast
      note: Plast incl. soft + hard plastic; collected in the same bin as cartons
    - url: https://affald.kk.dk/affaldsfraktion/saadan-sorterer-du-mad-og-drikkekartoner
      note: Cartons are sorted WITH plast, not with pap
    - url: https://affald.kk.dk/affaldsfraktion/saadan-sorterer-du-restaffald
      note: Restaffald examples (cigarette butts, styrofoam, some crisp bags, wet paper)
  accessed: 2026-11-10
  # TODO(team): open each page above, confirm the class list and the example
  # items below, then set this to true and record who checked.
  verified_by_human: false

classes:
  - id: 0
    key: madaffald
    da: Madaffald
    en: Food waste
    description: Food scraps and organic kitchen waste.
    examples: [nut shells, coffee grounds and filters, vegetable peelings]
  - id: 1
    key: restaffald
    da: Restaffald
    en: Residual waste
    description: What cannot be sorted for recycling. Catch-all class, see decisions.
    examples: [vacuum cleaner bags, cat litter, cigarette butts, styrofoam, wet paper]
  - id: 2
    key: papir
    da: Papir
    en: Paper
    description: Clean paper.
    examples: [window envelopes, books, writing and drawing paper]
  - id: 3
    key: pap
    da: Pap
    en: Cardboard
    description: Clean, flattened cardboard.
    examples: [shipping boxes, cardboard packaging]
  - id: 4
    key: plast
    da: Plast
    en: Plastic (incl. food and drink cartons)
    description: Soft and hard plastic. In Copenhagen, cartons go in the same bin.
    examples: [food packaging, plastic bottles without deposit, bags and film, milk cartons]
  - id: 5
    key: metal
    da: Metal
    en: Metal
    description: Metal items and packaging.
    examples: [cans, pots and pans, foil trays, aluminium foil, screws]
  - id: 6
    key: glas
    da: Glas
    en: Glass
    description: Glass packaging and household glass, all colours in one class.
    examples: [wine and spirits bottles, food jars, drinking glasses, vases]
  - id: 7
    key: farligt_affald
    da: Farligt affald
    en: Hazardous waste (incl. batteries)
    description: Small hazardous items. In TACO only batteries and aerosol cans.
    examples: [batteries, aerosol cans]

decisions:
  merged:
    - what: Mad- og drikkekartoner
      into: plast
      why: Official kk.dk guidance collects cartons with plastic in one bin, so a bin-level classifier does not need a separate class.
    - what: TACO fine-grained labels (e.g. Clear plastic bottle, Plastic film, Crisp packet)
      into: the Copenhagen bin they belong to, see datasets.taco.map
      why: TACO has 60 litter categories; the model predicts bins, not litter types.
  excluded_classes:
    - what: Tekstilaffald (textiles)
      why: TACO has no clothes or textiles (only 7 shoes, which are dropped). A class with zero images cannot be trained. Re-add if another dataset supplies textile images.
    - what: Bleaffald (nappies)
      why: Separate scheme exists, but no image data.
    - what: Elektronik, Stort indbo, Haveaffald, Trae
      why: Out of scope for household item photos and no image data.
  open_questions:
    - madaffald (8 TACO objects) and farligt_affald (12) are far too small to split 70/15/15 (test split gets about 1 image each). Keep, drop, or add another dataset for them? Feeds experiment #13.
    - Severe imbalance (plast about 2100 objects vs pap 80). Feeds experiment #13.
    - restaffald is a catch-all. Keep as a real class? It currently holds cigarettes, styrofoam, foam items, crisp packets and tissues (cigarettes alone are 667).
    - Dropped until someone confirms on kk.dk which bin they belong in - Paper cup, Broken glass (138 objects), Pizza box, Wrapping paper, Other carton, Meal carton, blister packs, Plastic glooves, Rope and strings, Shoe, Paper straw, Plastified paper bag.
    - Deposit (pant) bottles and cans go through the deposit system; a photo cannot show whether an item has a deposit. Drink can, Clear plastic bottle and Glass bottle are mapped to metal, plast and glas regardless.
    - Aerosol is mapped to farligt_affald (kk.dk says packaging with most hazard symbols is hazardous waste). Confirm.
    - Which TACO annotation file do we use? The official data/annotations.json has 1500 images; data/annotations_unofficial.json has 3831.
    - Battery goes to farligt_affald, but kk.dk lists "Batterier" as its own scheme. Confirm and rename the class if needed.

datasets:
  taco:
    # TACO: Trash Annotations in Context, https://github.com/pedropro/TACO
    # Counts below are objects in the official data/annotations.json
    # (1500 images, 4784 objects, 60 categories).
    licence_note: >
      Code is MIT. Images are not under one licence: per-image field in
      annotations.json is CC (319 images), ODBL (c) OpenLitterMap and
      Contributors (466) or unspecified (715). Record attribution and check
      terms before redistributing any images.
    data_prep_note: >
      TACO is an object-detection dataset (COCO boxes and masks), and 890 of
      1500 images contain more than one object. Classification samples must be
      crops of each annotated object (bbox), labelled with map_source_label().
      The train/val/test split must be done per source IMAGE, so crops of the
      same photo never end up in different splits.
    labels:
      - Aluminium foil
      - Battery
      - Aluminium blister pack
      - Carded blister pack
      - Other plastic bottle
      - Clear plastic bottle
      - Glass bottle
