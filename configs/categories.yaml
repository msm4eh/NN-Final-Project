  tuwien_organic:
    # Image Dataset of Domestic Organic Waste and Non-Organic Contaminants
    # for Classification and Segmentation (TU Wien Research Data)
    # Record: https://researchdata.tuwien.ac.at/records/27k90-dvw73
    # DOI: 10.48436/27k90-dvw73
    source_tag: added_verified   # keep in val/test only after our own review, see decisions
    version: "1.0.0"
    accessed: 2026-11-22
    archive_md5: a7bbbd61e899ede1123caa064d41fb89   # single ZIP, about 5.1 GiB
    licence_note: >
      CC BY 4.0. Attribution required: Wolling, F. and Pal, G. (TU Wien),
      "Image Dataset of Domestic Organic Waste and Non-Organic Contaminants
      for Classification and Segmentation", v1.0.0, DOI 10.48436/27k90-dvw73.
    review:
      verified_by_human: true
      # by penelope on nov 22
    data_prep_note: >
      450 photos from one household's smart trash can over six months: 119
      pure organic, 324 with added non-organic contaminants, 7 background.
      Folders (confirm after download): background/, organic/, non-organic/,
      masks/ (pixel-level segmentation) and labelmap.csv. Only the 119 pure
      organic photos are used as madaffald for now. The 324 contaminated
      photos also contain food waste, which could be cropped out later with the
      masks. All photos come from one home, so near-duplicates are likely:
      deduplicate by hash and split by photo. Open risk: if all madaffald
      comes from this bin view and the other classes from TACO, the model may
      learn the background. Check this in experiment #16.
    labels:
      - organic
      - non-organic
      - background
    map:
      organic: madaffald
    drop:
      - non-organic   # contains food waste too; revisit with masks
      - background
