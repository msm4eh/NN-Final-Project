      - Food Can
      - Aerosol
      - Drink can
      - Toilet tube
      - Other carton
      - Egg carton
      - Drink carton
      - Corrugated carton
      - Meal carton
      - Pizza box
      - Paper cup
      - Disposable plastic cup
      - Foam cup
      - Glass cup
      - Other plastic cup
      - Food waste
      - Glass jar
      - Plastic lid
