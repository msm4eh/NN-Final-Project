# Copenhagen household waste classes + source-dataset label mapping.
# Issue #7. Decisions behind this file are recorded in docs/decisions.md.
# Dataset: TACO (Trash Annotations in Context). Mapping revised 2026-11-17.

meta:
  status: final
  sources:
    - url: https://affald.kk.dk/affaldsordninger
      note: Official list of collection schemes (Bleaffald, Madaffald, Plast, Mad- og drikkekartoner, Papir, Restaffald, Metal, Pap, Glas, Stort indbo, Batterier, Tekstilaffald)
    - url: https://affald.kk.dk/affaldsfraktion/saadan-sorterer-du-plast
      note: Plast incl. soft + hard plastic; collected in the same bin as cartons
    - url: https://affald.kk.dk/affaldsfraktion/saadan-sorterer-du-mad-og-drikkekartoner
      note: Cartons are sorted WITH plast, not with pap
    - url: https://affald.kk.dk/affaldsfraktion/saadan-sorterer-du-restaffald
      note: Restaffald examples (cigarette butts, styrofoam, some crisp bags, wet paper)
  accessed: 2026-11-22
  verified_by_human: true
  # verified by Penelope Roberts 11/22/26

classes:
  - id: 0
    key: madaffald
    da: Madaffald
    en: Food waste
    description: Food scraps and organic kitchen waste.
    examples: [nut shells, coffee grounds and filters, vegetable peelings]
  - id: 1
    key: restaffald
    da: Restaffald
    en: Residual waste
    description: What cannot be sorted for recycling. Catch-all class, see docs/decisions.md D-06.
    examples: [vacuum cleaner bags, cat litter, cigarette butts, styrofoam, wet paper]
  - id: 2
    key: papir
    da: Papir
    en: Paper
    description: Clean paper.
    examples: [window envelopes, books, writing and drawing paper]
  - id: 3
    key: pap
    da: Pap
    en: Cardboard
    description: Clean, flattened cardboard.
    examples: [shipping boxes, cardboard packaging]
  - id: 4
    key: plast
    da: Plast
    en: Plastic (incl. food and drink cartons)
    description: Soft and hard plastic. In Copenhagen, cartons go in the same bin.
    examples: [food packaging, plastic bottles without deposit, bags and film, milk cartons]
  - id: 5
    key: metal
    da: Metal
    en: Metal
    description: Metal items and packaging.
    examples: [cans, pots and pans, foil trays, aluminium foil, screws]
  - id: 6
    key: glas
    da: Glas
    en: Glass
    description: Glass packaging and household glass, all colours in one class.
    examples: [wine and spirits bottles, food jars, drinking glasses, vases]

# Why each class is kept, merged or excluded, and why labels map where they do:
# see docs/decisions.md.

datasets:
  taco:
    # TACO: Trash Annotations in Context, https://github.com/pedropro/TACO
    # Counts below are objects in the official data/annotations.json
    # (1500 images, 4784 objects, 60 categories).
    licence_note: >
      Code is MIT. Images are not under one licence: per-image field in
      annotations.json is CC (319 images), ODBL (c) OpenLitterMap and
      Contributors (466) or unspecified (715). Record attribution and check
      terms before redistributing any images.
    data_prep_note: >
      TACO is an object-detection dataset (COCO boxes and masks), and 890 of
      1500 images contain more than one object. Classification samples must be
      crops of each annotated object (bbox), labelled with map_source_label().
      The train/val/test split must be done per source IMAGE, so crops of the
      same photo never end up in different splits.
    labels:
      - Aluminium foil
      - Battery
      - Aluminium blister pack
      - Carded blister pack
      - Other plastic bottle
      - Clear plastic bottle
      - Glass bottle
      - Plastic bottle cap
      - Metal bottle cap
      - Broken glass
      - Food Can
      - Aerosol
      - Drink can
      - Toilet tube
      - Other carton
      - Egg carton
      - Drink carton
      - Corrugated carton
      - Meal carton
      - Pizza box
      - Paper cup
      - Disposable plastic cup
      - Foam cup
      - Glass cup
      - Other plastic cup
      - Food waste
      - Glass jar
      - Plastic lid
      - Metal lid
      - Other plastic
      - Magazine paper
      - Tissues
      - Wrapping paper
      - Normal paper
      - Paper bag
      - Plastified paper bag
      - Plastic film
      - Six pack rings
      - Garbage bag
      - Other plastic wrapper
      - Single-use carrier bag
      - Polypropylene bag
      - Crisp packet
      - Spread tub
      - Tupperware
      - Disposable food container
      - Foam food container
      - Other plastic container
      - Plastic glooves
      - Plastic utensils
      - Pop tab
      - "Rope & strings"
      - Scrap metal
      - Shoe
      - Squeezable tube
      - Plastic straw
      - Paper straw
      - Styrofoam piece
      - Unlabeled litter
      - Cigarette
    map:
      # madaffald (8 objects)
      Food waste: madaffald
      # restaffald (970)
      Wrapping paper: restaffald
      Pizza box: restaffald
      Paper cup: restaffald
      Cigarette: restaffald
      Styrofoam piece: restaffald
      Foam cup: restaffald
      Foam food container: restaffald
      Crisp packet: restaffald
      Tissues: restaffald
      # papir (121)
      Normal paper: papir
      Magazine paper: papir
      Paper bag: papir
      # pap (80)
      Corrugated carton: pap
      Egg carton: pap
      Toilet tube: pap
      # plast (2114, incl. drink cartons)
      Other plastic bottle: plast
      Clear plastic bottle: plast
      Plastic bottle cap: plast
      Plastic lid: plast
      Other plastic: plast
      Plastic film: plast
      Six pack rings: plast
      Garbage bag: plast
      Other plastic wrapper: plast
      Single-use carrier bag: plast
      Polypropylene bag: plast
      Spread tub: plast
      Tupperware: plast
      Disposable food container: plast
      Other plastic container: plast
      Plastic utensils: plast
      Squeezable tube: plast
      Plastic straw: plast
      Disposable plastic cup: plast
      Other plastic cup: plast
      Drink carton: plast
      # metal (534)
      Aluminium foil: metal
      Metal bottle cap: metal
      Metal lid: metal
      Food Can: metal
      Drink can: metal
      Pop tab: metal
      Scrap metal: metal
      # glas (254)
      Broken glass: glas
      Glass bottle: glas
      Glass jar: glas
      Glass cup: glas
    drop:
      # 12 labels, 703 objects
      - Battery
      - Aerosol
      - Aluminium blister pack
      - Carded blister pack
      - Other carton
      - Meal carton
      - Plastified paper bag
      - Plastic glooves
      - "Rope & strings"
      - Shoe
      - Paper straw
      - Unlabeled litter
  tuwien_organic:
    # Image Dataset of Domestic Organic Waste and Non-Organic Contaminants
    # for Classification and Segmentation (TU Wien Research Data)
    # Record: https://researchdata.tuwien.ac.at/records/27k90-dvw73
    # DOI: 10.48436/27k90-dvw73
    source_tag: added_verified   # keep in val/test only after our own review, see docs/decisions.md D-03
    version: "1.0.0"
    accessed: 2026-11-22
    archive_md5: a7bbbd61e899ede1123caa064d41fb89   # single ZIP, about 5.1 GiB
    licence_note: >
      CC BY 4.0. Attribution required: Wolling, F. and Pal, G. (TU Wien),
      "Image Dataset of Domestic Organic Waste and Non-Organic Contaminants
      for Classification and Segmentation", v1.0.0, DOI 10.48436/27k90-dvw73.
    review:
      verified_by_human: true
      # by penelope on nov 22
    data_prep_note: >
      450 photos from one household's smart trash can over six months: 119
      pure organic, 324 with added non-organic contaminants, 7 background.
      Folders (confirm after download): background/, organic/, non-organic/,
      masks/ (pixel-level segmentation) and labelmap.csv. Only the 119 pure
      organic photos are used as madaffald for now. The 324 contaminated
      photos also contain food waste, which could be cropped out later with the
      masks. All photos come from one home, so near-duplicates are likely:
      deduplicate by hash and split by photo. Open risk: if all madaffald
      comes from this bin view and the other classes from TACO, the model may
      learn the background. Check this in experiment #16.
    labels:
      - organic
      - non-organic
      - background
    map:
      organic: madaffald
    drop:
      - non-organic   # contains food waste too; revisit with masks
      - background
